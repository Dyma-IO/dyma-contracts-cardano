name: Feature request
description: Suggest an improvement to the contracts, tooling or documents
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The escrow rules are shared with Dyma's CosmWasm escrow: a rule change applies to both contracts.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What need does this address, and for whom (earners, campaign owners, integrators, operators)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
